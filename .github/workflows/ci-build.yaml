
name: DevOps Capstone CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify README
        run: |
          test -f README.md
          echo "README verification successful"

      - name: Verify Python installation
        run: |
          python --version
          python -m pip --version

      - name: Build verification complete
        run: |
          echo "DevOps Capstone initial checks passed!"
