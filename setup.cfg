
[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1
cover-html=1
cover-html-dir=htmlcov
cover-branches=1
with-spec=1
spec-color=1

[coverage:run]
branch = True
source = service
omit =
    */tests/*
    */venv/*
    */.venv/*

[coverage:report]
show_missing = True
skip_covered = False
fail_under = 80

[coverage:html]
directory = htmlcov

[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist
ignore = E203,W503

[pylint.MASTER]
ignore = .git,venv,.venv
jobs = 1

[pylint.FORMAT]
max-line-length = 120

[pylint.DESIGN]
max-args = 10

[pylint.MESSAGES CONTROL]
disable =
    missing-module-docstring,
    missing-class-docstring,
    missing-function-docstring,
    too-few-public-methods

[pylint.REPORTS]
reports = no
score = yes
